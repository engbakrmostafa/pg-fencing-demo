services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fencing_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo-only
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fencing_demo"]
      interval: 1s
      timeout: 3s
      retries: 30
