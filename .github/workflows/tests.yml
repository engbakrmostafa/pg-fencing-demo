name: PostgreSQL tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fencing_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: demo-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fencing_demo"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:demo-only@127.0.0.1:5432/fencing_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
